[project]
name = "sasayakey"
version = "0.1.0"
description = "Voice AI device — batch and real-time speech recognition"
requires-python = ">=3.11"
dependencies = [
    "pyaudio>=0.2.14",
    "vosk>=0.3.45",
    "faster-whisper>=1.0.0",
    "anthropic>=0.40.0",
    "numpy>=1.24.0",
    "setuptools>=82.0.1",
    "webrtcvad-wheels>=2.0.14",
]

[tool.uv]
# Keep editable installs in-tree so uv run works without install
package = false
